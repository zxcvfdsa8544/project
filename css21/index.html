<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屬性選擇器</title>
    <style>
        span[class]{
            color: rgb(191, 76, 191);
        }
        a[title]{
            color: red;
        }
        a[href$=".pdf"]{
            color: green;
        }a[href^="https"]{
            color: pink;
        }
    </style>
</head>
<body>
    <span class="class1">這是一個紫色的段落。</span>
    <span class="class2">這也是一個紫色的段落。</span>
    <span>這個段落不是紫色。</span>
    <a href="http://www.google.com" title="sea">這是一個紅色的鏈接。</a>
    <a href="http://www.example.com" title="example">這也是一個紅色的鏈接。</a>
    <a href="file.pdf">這是一個綠色的鏈接。</a>
    <a href="https://www.example.com">這是一個粉紅色的鏈接。</a>
    <span class="class1 class2">這是一個紫色的段落，距有多個類別。</span>
</body>
</html>

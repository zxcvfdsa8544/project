<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一次修改多個元素的樣式</title>
    <style>
        /* CSS Here */
        p, li, a{
            color: orange;
            font-size: 20px;
        }
        /* li{
            color: orange;
            font-size: 20px;
        }
        a{
            color: orange;
            font-size: 20px;
        } */
    </style>
</head>
<body>
    <p>嘿!我是一個大膽的、紅色的段落，我喜歡與大家分享快樂的故事。</p>
    <span>我是一個亮麗的紅色文本，像一朵盛開的玫瑰花。</span>
    <a href="#">我是一個大膽的紅色鏈接，點擊我你將會發現新世界。</a>
    <ul>
        <li>我是列表中的第一個項目，我像一根紅色的棒棒糖，甜而不膩</li>
        <li>我是列表中的第二個項目，我像一杯熱紅酒，溫暖而迷人</li>
    </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Overflow</title>
    <style>
        #box_1{
            width: 250px;
            height: 250px;
            border: 1px solid;
            overflow: auto;
        }
        /*     
        1. visible
        2. hidden
        3. clip
        4. scroll
        5. auto */
    </style>
</head>
<body>
    <div id="box_1">
        <p>
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Repellat et, assumenda dolor corrupti quidem eligendi dolorum debitis, quis ratione consectetur nisi aperiam veniam accusamus ullam nemo, pariatur amet quos nulla?
        </p>
    </div>
    <!--
    五種 狀態 : 
    1. visible
    2. hidden
    3. clip
    4. scroll
    5. auto
     -->
</body>
</html>

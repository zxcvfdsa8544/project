<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一個與最後一個子元素
        fiist-child and last-child
    </title>
    <style>
        article p:first-child{
            color: green;
        }
        article p:last-child{
            color: red;
        }
    </style>
</head>
<body>
    <article>
        <p>這是第一段文字。</p>
        <p>這是第二段文字。</p>
        <p>這是第三段文字。</p>
        <p>這是最後一段文字。想閱讀更多?<a href="#">點擊這裡</a></p>
    </article>
    <article>
        <p>這是另一篇文章的第一段文字。</p>
        <p>這是第二段文字。</p>
        <p>這是第三段文字。</p>
        <p>這是最後一段文字。想閱讀告多?<a href="#">點擊這裡</a></p>
    </article>
</body>
</html>

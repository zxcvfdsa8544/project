<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子選擇器 (Child Selector)</title>
    <style>
        #main-content > p{
            color: orange;
        }
        #main-content > div > p{
            color: blue;
        }
    </style>
</head>
<body>
    <div id="main-content">
        <p>我是直接子節點。</p>
        <div>
            <p>我不是直接子節點，我是孫節點</p>
        </div>
    </div>
</body>
</html>

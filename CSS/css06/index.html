<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS中的陰影</title>
    <style>
        h1{
            text-shadow: 3px 10px 10px red;
        }
        #box_1{
            box-shadow: 3px 10px 10px blue;
        }
    </style>
</head>
<body>
    <!-- 文字陰影 盒子(box)陰影 -->
     <h1>我是阿柴</h1>
     <div id="box_1">
        我是第一個盒子
     </div>
     <div id="box_2">
        我是第二個盒子
     </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform 變形</title>
    <style>
        #box1{
            /* transform: translateX(50px); */
            /* transform: scale(0.5); */
            /* transform: rotate(45deg); */
            transform: translateX(50px) rotate(45deg) scale(2);
            border: 5px solid;
            width: 100px;
            height: 100px;
            font-size: 40px;
            background-color: orange;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="box1">嗨</div>
</body>
</html>

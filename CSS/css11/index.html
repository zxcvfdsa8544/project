<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 中的高度和寬度</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .container{
            height: 100vh;
            background-color: gray;
        }
        .box{
            /* width: 25%; */
            min-width: 25%;
            max-width: 50%;
            height: 100px;
            border: 3px solid black;
            float: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            我是第 1 個 box
        </div>
        <div class="box">
            我是第 2 個 box
        </div>
        <div class="box">
            我是第 3 個 box
        </div>
        <div class="box">
            我是第 4 個 box
        </div>
    </div>
</body>
</html>

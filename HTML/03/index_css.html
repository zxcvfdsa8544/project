<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 的顏色</title>
    <style>
        body{
            color: blue;
        }
        #p1{
            color: tomato;
        }
        #p2{
            /* red, green, blue */
            color: rgb(46, 64, 198);
        }
        #p3{
            color: #ffffff;
            background-color: #000;
        }
        #p4{
            /* HSL  H 色調, S 飽和度, L 亮度*/
            color: hsl(100, 54%, 42%);
        }
    </style>
</head>
<body>
    <p id="p1">這是第一段</p>
    <p id="p2">這是第二段</p>
    <p id="p3">這是第三段</p>
    <p id="p4">這是第四段</p>
</body>
</html>

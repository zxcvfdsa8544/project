<body>
    <h1>陣列的進階方法 map()</h1>
    <script>
        var dogs = ['Boy1', 'Boy2', 'Girl1', 'Girl2'];
        // var result = dogs.map(function(dog){
        //     return dog + ' is good';
        // });
        // console.log(result);

        // 用 for
        function map2(dogs){
            var result = [];
            for(var i = 0; i < dogs.length; i++){
                var str = dogs[i] + 'is good';
                // console.log(str);
                result.push(str);
            }
            return result;
        }
        var mydog = map2(dogs);
        console.log(mydog);

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>陣列的基本操作 pop 與 push</h1>
    <script>
        var arr = ['apple', 'orange', 'banana'];
        console.log(arr);

        arr.pop();
        console.log(arr)

        arr.push('cat');
        console.log(arr);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剪刀石頭布</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="buttons">
            <button class="pssButton" value="Stone">✊</button>
            <button class="pssButton" value="Paper">🖐️</button>
            <button class="pssButton" value="Scissors">✌️</button>
        </div>
        <div class="resultContainer">
            <div id="player-score"></div>
            <div id="hands"></div>
            <div id="result"></div>
            <button id="endGameButton">🔘</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

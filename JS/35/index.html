<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="para">Some text here</p>
    <button onclick="buttonColor('blue')">blue</button>
    <button onclick="buttonColor('red')">red</button>
    
    <script>
        function buttonColor(newColor){
            var elem = document.getElementById("para");
            elem.style.color = newColor;
        }
    </script>
</body>
</html>

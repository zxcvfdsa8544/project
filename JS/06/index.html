<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>第二種迴圈 while ，用 while 也可以達到相同的效果。</h1>
    <script>
        var x = 0;
        while(x<10){
            x++;
            console.log('第' + x + '隻綿羊');
             if(x === 5){
                break;
            }
        }
    </script>
</body>
</html>

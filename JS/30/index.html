<body>
    <h1>for of 與 for in 與 iterator</h1>
    <script>
        // for of 可以迭代 「可迭代的物件」iterable object // iterator
        // const array = ['a', 'b', 'c'];
        // for(const element of array){
        //     console.log(element);
        // }

        // for in 迭代可列舉屬性
        var o = {a:1, b:2, c:3};
        
        function show_props(obj, objName){
            var result = "";

            for(var prop in obj){
                result += objName + "." + prop + "=" + obj[prop] + "\n";
            }

            return result;
        }
        alert(show_props(o, "o"));

    </script>

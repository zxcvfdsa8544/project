<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>列陣的基本操作 indexOf</h1>
    <script>
        var arr = ['apple', 'orange', 'banana'];
        // indexOf 取得元素索引
        console.log(arr.indexOf('banana'));
        console.log(arr.indexOf('orange'));
        
        
    </script>
</body>
</html>

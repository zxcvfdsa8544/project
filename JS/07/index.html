<body>
    <h1>第三種迴圈 do..while 先跑一次，在判斷要不要繼續跑。</h1>
    <script>
        let i = 10;
        do{
            i++;
            console.log('第' + i + '隻綿羊')
        }while(i < 10)

    </script>

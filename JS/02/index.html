<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>賦值運算子</h1>
    <script>
        console.log('賦值運算子')
        var x = 1;
        console.log("x:", x)
        x += 1;
        console.log("x += 1 等於", x)
        // x = x+1
        var y = 10;
        y -= 2;
        // y = y-2
        console.log(y)
        x *=  5;
        // x = x*5
        console.log('x *= 5 等於', x)
        x /= 2;
        // x = x/2
        console.log('x /= 2 等於', x)

        // 餘數
        var z = 35;
        z %= 10;
        // z = z%10;
        console.log('z %= 10 等於', z)

        // 次方
        var a = 2;
        a **= 5;
        // a = a**5;
        console.log('a **= 5 等於', a)

        var b;
        b ||= 10;
        console.log('給預設值 b', b);

        var c = 555;
        c ||= 10;
        console.log('給預設值 c', c);
        
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制流程 Control Flow</title>
</head>
<body>
    <!-- <h1>if 與 else，如果你歐趴，就帶你歐洲玩</h1> -->
     <script>
        // boolean true or false
        var str = '只被當一科'
        if(str === '歐趴'){
            console.log('帶你去歐洲玩')
        }else if(str === '只被當一科'){
            console.log('帶你去宜蘭玩')
        }else{
            console.log('禁足')
        }
     </script>
</body>
</html>
